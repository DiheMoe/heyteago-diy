services:
  server:
    image: ghcr.io/dihemoe/heyteago-diy/server:latest
    ports:
      - "127.0.0.1:8790:8790"
    restart: unless-stopped

  web:
    image: ghcr.io/dihemoe/heyteago-diy/web:latest
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - server
    restart: unless-stopped
