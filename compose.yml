services:
  server:
    build: .
    ports:
      - "127.0.0.1:8790:8790"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - server
    restart: unless-stopped
